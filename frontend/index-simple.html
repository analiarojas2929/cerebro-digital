<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Cerebro Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }
        
        .message {
            margin: 10px 0;
            display: flex;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .category-tag {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 5px;
            background: rgba(0,0,0,0.1);
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        #sendBtn:hover {
            transform: scale(1.05);
        }
        
        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .stats {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #888;
            margin-top: 3px;
        }
        
        .loading {
            display: none;
            color: #888;
            font-size: 13px;
            padding: 10px;
        }
        
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Cerebro Digital</h1>
            <p>Sistema con memoria y clasificación automática</p>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalConvs">0</div>
                <div class="stat-label">Conversaciones</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalMems">0</div>
                <div class="stat-label">Memorias</div>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-content">
                    ¡Hola! Soy tu Cerebro Digital. Puedo recordar nuestras conversaciones y clasificarlas automáticamente. ¿En qué puedo ayudarte?
                </div>
            </div>
        </div>
        
        <div class="loading" id="loading">Pensando...</div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Escribe tu mensaje..."
                autocomplete="off"
            >
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let sessionId = null;

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const loading = document.getElementById('loading');

        // Enviar mensaje
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Agregar mensaje del usuario
            addMessage(message, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            loading.classList.add('active');

            try {
                const response = await fetch(`${API_URL}/chat/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                
                if (!sessionId) {
                    sessionId = data.session_id;
                }

                // Agregar respuesta del asistente
                addMessage(data.response, 'assistant', data.category);
                
                // Actualizar estadísticas
                updateStats();

            } catch (error) {
                console.error('Error:', error);
                addMessage('❌ Error al conectar con el servidor. ¿Está corriendo el backend en http://localhost:8000?', 'assistant');
            }

            loading.classList.remove('active');
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // Agregar mensaje al chat
        function addMessage(text, role, category = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let content = `<div class="message-content">${text}`;
            if (category) {
                const emoji = {
                    'trabajo': '💼',
                    'tecnología': '💻',
                    'personal': '🏠',
                    'general': '📌'
                }[category] || '📌';
                content += `<div class="category-tag">${emoji} ${category}</div>`;
            }
            content += '</div>';
            
            messageDiv.innerHTML = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Actualizar estadísticas
        async function updateStats() {
            try {
                const response = await fetch(`${API_URL}/memory/stats`);
                const data = await response.json();
                
                document.getElementById('totalConvs').textContent = data.total_conversations;
                document.getElementById('totalMems').textContent = data.total_memories;
            } catch (error) {
                console.error('Error al obtener estadísticas:', error);
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Cargar estadísticas iniciales
        updateStats();
        messageInput.focus();
    </script>
</body>
</html>
